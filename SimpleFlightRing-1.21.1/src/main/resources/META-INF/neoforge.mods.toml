[[mods]]
modId="simpleflightring"
version="${file.jarVersion}"
displayName="简易飞行戒指 Simple Flight Ring"
logoFile="logo.png"
authors="EasyRain"
description='''
Wear a flight ring and fly like in creative mode: double-tap Space to take off, hold Space to rise, Shift to descend.
Flight costs 1 durability per second; the six tiers of rings upgrade into each other, and eight relic rings each carry an ability of their own.
'''

