plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.17'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Default run configurations.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    flatDir {
        dir 'libs'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Curios API - optional dependency, loaded from local jars.
    // The mod works without Curios (rings function from the inventory).
    compileOnly files("libs/curios-neoforge-9.5.1+1.21.1-api.jar")
    localRuntime files("libs/curios-neoforge-9.5.1+1.21.1.jar")

    // Sophisticated Backpacks - optional dependency: rings stored inside backpacks
    // carried by the player also grant flight. Sophisticated Core is its required
    // dependency (parent classes of the backpack API live there).
    compileOnly files("libs/sophisticatedbackpacks-1.21.1-3.24.1.1207.jar")
    compileOnly files("libs/sophisticatedcore-1.21.1-1.3.0.896.jar")
    localRuntime files("libs/sophisticatedbackpacks-1.21.1-3.24.1.1207.jar")
    localRuntime files("libs/sophisticatedcore-1.21.1-1.3.0.896.jar")
}

tasks.named('jar', Jar).configure {
    archiveVersion = "${mod_version}-${minecraft_version}"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Reproducible archives: no build timestamp in the manifest, and fixed entry timestamps plus a stable entry
// order. Without this, building the identical source twice produced different jars (the manifest's
// Implementation-Timestamp alone was enough), so an MD5 could never be used as evidence that the source had
// not changed. With it, two consecutive builds of the same source are byte-identical.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Expand the declared replace properties in the mod metadata, so the built jar carries a real version
// instead of the "${file.jarVersion}" placeholder. NeoForge resolves that placeholder at runtime, but
// Modrinth (and other tooling) reads META-INF/neoforge.mods.toml literally, and therefore showed
// "${file.jarVersion}" as the version of every 1.21.1 upload. This is the same block the 26.1.2 project
// and the other 1.21.1 projects in this workspace use.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Copy the built mod jar to the workspace root (D:\DshWorkSpace\MCMOD) for easy access.
// Implemented as an imperative copy so Gradle does not track the workspace root
// (it contains unrelated files, e.g. gradle caches with lock files).
tasks.register('copyToWorkspace') {
    doLast {
        copy {
            from(tasks.named('jar'))
            into file('../../')
        }
    }
}
tasks.named('build') {
    dependsOn 'copyToWorkspace'
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
