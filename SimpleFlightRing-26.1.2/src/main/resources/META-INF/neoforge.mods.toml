license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="EasyRain"
description='''
Wear a flight ring and fly like in creative mode: double-tap Space to take off, hold Space to rise, Shift to descend.
Flight costs 1 durability per second; the six tiers of rings upgrade into each other, and eight relic rings each carry an ability of their own.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[26.1.2,26.2)"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[15,16)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cloth_config"
type="optional"
versionRange="[26,27)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
type="optional"
versionRange="[3.25,4)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="simpleflightring.mixins.json"
