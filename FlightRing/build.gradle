plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.17'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Default run configurations.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    flatDir {
        dir 'libs'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Curios API - optional dependency, loaded from local jars.
    // The mod works without Curios (rings function from the inventory).
    compileOnly files("libs/curios-neoforge-9.5.1+1.21.1-api.jar")
    localRuntime files("libs/curios-neoforge-9.5.1+1.21.1.jar")

    // Cloth Config API - optional dependency for the in-game config screen.
    // The mod works without it (config can be edited in config/flightring-client.toml).
    compileOnly files("libs/cloth-config-15.0.140-neoforge.jar")
    localRuntime files("libs/cloth-config-15.0.140-neoforge.jar")

    // Sophisticated Backpacks - optional dependency: rings stored inside backpacks
    // carried by the player also grant flight. Sophisticated Core is its required
    // dependency (parent classes of the backpack API live there).
    compileOnly files("libs/sophisticatedbackpacks-1.21.1-3.24.1.1207.jar")
    compileOnly files("libs/sophisticatedcore-1.21.1-1.3.0.896.jar")
    localRuntime files("libs/sophisticatedbackpacks-1.21.1-3.24.1.1207.jar")
    localRuntime files("libs/sophisticatedcore-1.21.1-1.3.0.896.jar")

    // Mekanism - optional compatibility: if the MekaSuit leggings have the
    // Gyroscopic Stabilization Unit installed, that module already cancels the
    // mid-air mining slow-down, so Flight Stability skips its own handling to
    // avoid doubling the effect.
    compileOnly files("libs/Mekanism-1.21.1-10.7.19.85.jar")
    localRuntime files("libs/Mekanism-1.21.1-10.7.19.85.jar")
}

tasks.named('jar', Jar).configure {
    archiveVersion = "${mod_version}-${minecraft_version}"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Copy the built mod jar to the workspace root (D:\Temp\MCMOD) for easy access.
// Implemented as an imperative copy so Gradle does not track the workspace root
// (it contains unrelated files, e.g. gradle caches with lock files).
tasks.register('copyToWorkspace') {
    doLast {
        copy {
            from(tasks.named('jar'))
            into file('../../')
        }
    }
}
tasks.named('build') {
    dependsOn 'copyToWorkspace'
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
