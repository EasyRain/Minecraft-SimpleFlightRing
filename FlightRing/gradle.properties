org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1,1.21.2)
# The NeoForge version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.248
# The NeoForge version range can use any version of NeoForge as bounds or match the loader version range
neo_version_range=[21.1.248,)
# The loader version range can only use the major version of NeoForge/FML as bounds
loader_version_range=[2,)

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=flightring
# The human-readable display name for the mod.
mod_name=Simple Flight Ring
# The license of the mod.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.2
# The group ID for the mod.
mod_group_id=com.flightring
# The authors of the mod.
mod_authors=EasyRain
# The description of the mod.
mod_description=Simple Flight Ring - A small mod adding 6 tiers of flight rings (Wood/Stone/Iron/Gold/Diamond/Netherite) with optional Curios API support.
